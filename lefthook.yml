# Quality gate: every commit runs the full chain in order.
# Any tool failing (including warning-level findings) blocks the commit.
pre-commit:
  jobs:
    - name: tsgo
      run: bunx --bun tsgo --noEmit

    - name: oxlint
      run: bunx --bun oxlint . --deny-warnings

    - name: biome
      run: bunx --bun biome check .

    - name: eslint
      run: bunx --bun eslint .

    - name: jscpd
      run: bunx --bun jscpd src

    - name: knip
      run: bunx --bun knip
      env:
        # oxc-parser raw-transfer buffer allocation fails on this host
        # (Node 24 + large heaps); the AST walk path is equivalent.
        KNIP_DISABLE_RAW_TRANSFER: "1"
